[providers]
  # Força a Railway a usar o Node.js v20 (ambiente mais estável)
  node = "20"

[phases.install]
  # Força a instalação das dependências limpas
  cmds = ["npm install --production=false"]

[phases.build]
  # Pula etapas desnecessárias de build (já que é só backend + arquivos estáticos)
  cmds = ["echo 'No build required for this static/node app'"]

[start]
  # Comando exato para iniciar o servidor
  cmd = "npm start"
