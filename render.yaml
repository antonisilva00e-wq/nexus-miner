services:
  - type: web
    name: nexus-miner-erp
    env: node
    buildCommand: npm install
    startCommand: npm start
    plan: starter # Paid plan required for disks ($7/mo)
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
